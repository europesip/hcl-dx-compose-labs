# Lab 0 · StorageClasses for the single-node PoC (k3s on WSL2). Applied by 01-storage.sh, which
# replaces ${SC_RWO} / ${SC_RWX} with the names in env.sh (dx-deploy-rwo / dx-deploy-rwx by default).
#
#   RWO -> local-path provisioner shipped with k3s (dynamic: one directory per PVC)
#   RWX -> STATIC (no-provisioner): k3s local-path only supports ReadWriteOnce and the DX chart
#          asks for ReadWriteMany for the DAM binaries. On a single node a hostPath
#          PersistentVolume really is RWX (every pod sees the same disk): 01-storage.sh creates
#          it with the name dx-poc-dam-binaries.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ${SC_RWO}
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ${SC_RWX}
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
