# ------------------------------------------------------------------------------------------
# Lab 0 · DX PoC layer: reduced resources for a single node with ~15 GiB (WSL2)
# Added by common/dx-helm.sh at the end of the layers when DX_POC=1 (env.sh).
#
# Only the REQUESTS are lowered (what Kubernetes adds up to decide whether a pod fits); the
# LIMITS are kept. The chart default requests (~10.4 GiB for base DX alone) are sized for
# production and are far above the real usage of a demo (the Web Engine uses ~2.7 GiB).
# DO NOT use in production.
# ------------------------------------------------------------------------------------------
resources:
  webEngine:
    requests: { cpu: "1000m", memory: "3072Mi" }      # default 2000m / 4096Mi
  imageProcessor:
    requests: { cpu: "100m", memory: "512Mi" }        # default 200m / 2048Mi
  digitalAssetManagement:
    requests: { cpu: "250m", memory: "1024Mi" }       # default 500m / 1536Mi
  persistenceNode:
    requests: { cpu: "250m", memory: "768Mi" }        # default 500m / 1024Mi
