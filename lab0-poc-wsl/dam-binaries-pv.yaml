# Lab 0 · RWX volume for the DAM binaries in the PoC (hostPath on the only node).
# Created by 01-storage.sh (which replaces ${SC_RWX}). Capacity = volumes.digitalAssetManagement.binaries
# of Lab 1 (10Gi).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dx-poc-dam-binaries
  labels: { lab: hcl-dx-compose }
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ${SC_RWX}
  hostPath:
    path: /var/lib/dx-poc/dam-binaries
    type: DirectoryOrCreate
