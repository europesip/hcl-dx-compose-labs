# ------------------------------------------------------------------------------------------
# Lab 1 · Base custom-values.yaml for DX Compose · chart hcl-dx-deployment 2.49.0 (CF238)
#
# It is the base layer for EVERY iteration. The following labs do not modify it: they add their
# own layers with -f (see common/dx-helm.sh). It only contains what changes compared to the chart
# default values (charts/values-dx-default-2.49.0.yaml).
#
# Set from env.sh by common/dx-helm.sh with --set-string (so they are not repeated here):
#   networking.webEngine.host           <- DX_HOST
#   volumes.*.storageClassName          <- SC_RWO / SC_RWX (the values below are only the defaults)
# ------------------------------------------------------------------------------------------

# Images: straight from the official HCL Harbor. The names (dx-compose/webengine, ...) and the
# CF238 tags already come in the chart, so we only change the registry and the pull secret.
images:
  repository: "hclcr.io"
  imagePullSecrets:
    - name: regcred          # created by lab1-dx-base/01-secrets.sh

# Volumes: the two StorageClasses of the requirements (RWO and RWX)
volumes:
  digitalAssetManagement:
    binaries:                # shared by every DAM pod -> RWX
      storageClassName: "dx-deploy-rwx"
      requests:
        storage: "10Gi"
  persistenceNode:
    database:                # DX internal PostgreSQL (DAM, People Service, internal IQ)
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "10Gi"
  licenseManager:
    data:
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "2Gi"
  webEngine:
    customization:           # server profile and Derby (minimum 5Gi: Derby takes ~700Mi)
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "5Gi"
    log:
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "5Gi"

# What is deployed: DX Compose = Web Engine (not Core). Without the DX OpenLDAP (we use an
# external one in Lab 2) and without Remote Search.
applications:
  core: false
  webEngine: true
  openLdap: false            # the chart default is true
  remoteSearch: false
  persistence: true          # Persistence Node: DAM database

peopleservice:
  enabled: false

networking:
  haproxy:
    # ClusterIP: published with an Ingress (Kubernetes) or a Route (OpenShift), see 03-expose.sh
    serviceType: "ClusterIP"
  # TLS certificate served by HAProxy (created by 01-secrets.sh)
  tlsCertSecret: "dx-tls-cert"

security:
  webEngine:
    # wpsadmin credentials in a secret. With customWebEngineSecret, the plain-text user and
    # password must be empty (otherwise the chart refuses to install).
    webEngineUser: null
    webEnginePassword: null
    customWebEngineSecret: "web-engine-secret"

logging:
  webEngine:
    level:
      - "*=info"

configuration:
  containerTimezone: "Europe/Madrid"   # any IANA time zone, e.g. "Europe/London", "UTC"
  # Container that validates the requirements (storage, resources) before each pod starts
  prereqsChecker:
    enabled: true
