# Kubernetes with Traefik (INGRESS_CLASS=traefik, the Ingress controller that k3s installs by
# default) · DX IngressRoute. Applied by 03-expose.sh instead of ingress-dx.yaml, which replaces
# the env.sh variables.
#
# Same design as ingress-dx.yaml: TLS is terminated at Traefik with the dx-tls-cert certificate and
# Traefik re-encrypts towards HAProxy, the only entry point of DX. The whole "/" is published.
# An IngressRoute (Traefik CRD) is used instead of a standard Ingress so that the connection to
# HAProxy is configured here, in the route, without annotating the Service of the DX chart.
# Traefik does not limit the request body size (large uploads to DAM) and does not cut long
# responses (IQ) by default.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: ${DX_RELEASE}-haproxy
  namespace: ${DX_NS}
spec:
  insecureSkipVerify: true   # HAProxy serves the self-signed dx-tls-cert (ingress-nginx does not verify it either)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${DX_RELEASE}-ingress
  namespace: ${DX_NS}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`${DX_HOST}`)
      kind: Rule
      services:
        - name: ${DX_RELEASE}-haproxy
          port: 443
          scheme: https
          serversTransport: ${DX_RELEASE}-haproxy
  tls:
    secretName: dx-tls-cert
---
# http -> https, as ingress-nginx does by default for an Ingress with TLS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${DX_RELEASE}-https-redirect
  namespace: ${DX_NS}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${DX_RELEASE}-ingress-http
  namespace: ${DX_NS}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`${DX_HOST}`)
      kind: Rule
      middlewares:
        - name: ${DX_RELEASE}-https-redirect
      services:
        - name: ${DX_RELEASE}-haproxy
          port: 443
