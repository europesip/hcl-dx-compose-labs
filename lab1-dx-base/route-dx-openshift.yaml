# OpenShift (PLATFORM=openshift) · DX Route with TLS passthrough. Applied by 03-expose.sh.
# The OpenShift router does not decrypt the traffic: TLS is terminated by the DX HAProxy with dx-tls-cert.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${DX_RELEASE}-passthrough
  namespace: ${DX_NS}
spec:
  host: ${DX_HOST}
  port:
    targetPort: "haproxy"
  to:
    kind: Service
    name: ${DX_RELEASE}-haproxy
    weight: 100
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: None
