# Kubernetes (PLATFORM=kubernetes) · DX Ingress with ingress-nginx. Applied by 03-expose.sh,
# which replaces the env.sh variables.
#
# TLS is terminated at the Ingress with the same dx-tls-cert certificate and the Ingress
# re-encrypts towards HAProxy (backend-protocol HTTPS), the only entry point of DX.
# The whole "/" is published: DX uses /wps, /dx (API, DAM, IQ), /hcl, /ibm and /adminCenter.
#
# k3s ships Traefik by default; the reference lab cluster uses ingress-nginx. With Traefik
# (INGRESS_CLASS=traefik), 03-expose.sh applies ingressroute-dx-traefik.yaml instead of this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${DX_RELEASE}-ingress
  namespace: ${DX_NS}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"          # large uploads to DAM
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"     # long IQ responses
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: ${INGRESS_CLASS}
  tls:
    - hosts:
        - ${DX_HOST}
      secretName: dx-tls-cert
  rules:
    - host: ${DX_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${DX_RELEASE}-haproxy
                port:
                  number: 443
