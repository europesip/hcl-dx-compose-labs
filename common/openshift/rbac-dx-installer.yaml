# OpenShift only, and only if the installation is done by a user without cluster-admin (e.g. "dxadmin").
# In the reference lab environment (k3s) we use the admin kubeconfig and this file is not used.
#
# As cluster-admin:
#   oc adm policy add-role-to-user admin dxadmin -n dx-demo
#   oc adm policy add-role-to-user admin dxadmin -n dx-shared
#   oc apply -f common/openshift/rbac-dx-installer.yaml
#   oc adm policy add-role-to-user dx-installer-extra-perms dxadmin -n dx-demo
#
# The OpenShift "admin" role does not include EndpointSlices or endpoints/restricted, which the DX
# chart needs to manage. This ClusterRole (bound only in the namespace) adds those permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dx-installer-extra-perms
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["create", "update", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["endpoints/restricted"]
    verbs: ["create"]
