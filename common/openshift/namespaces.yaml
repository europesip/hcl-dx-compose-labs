# OpenShift only (PLATFORM=openshift). Applied by common/01-namespaces.sh, which replaces the variables.
# Annotations required by HCL for the DX namespace (UID range and groups that the restricted-v2 SCC
# assigns to the pods; DX containers run with UID/GID 1000-1001).
# Documentation: DX Compose CF239 > Preparation > Mandatory tasks > Preparing the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ${DX_NS}
  annotations:
    openshift.io/sa.scc.mcs: "s0:c24,c4"
    openshift.io/sa.scc.supplemental-groups: "1001/10000"
    openshift.io/sa.scc.uid-range: "1000/10000"
---
# The third-party namespace needs no annotations: CNPG and LiteLLM work with restricted-v2 using the
# range OpenShift assigns. For OpenLDAP see lab2-ldap-postgres/a-ldap/openldap-values.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: ${SHARED_NS}
