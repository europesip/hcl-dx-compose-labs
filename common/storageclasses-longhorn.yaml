# REFERENCIA · StorageClasses del clúster del webinar (k3s + Longhorn 1.12).
#
# DX necesita dos StorageClasses (los nombres se usan en lab1-dx-base/custom-values.yaml y en
# lab2-ldap-postgres/b-postgres/03-cluster-dx-pg.yaml):
#   dx-deploy-rwo  ReadWriteOnce  -> Web Engine (customization, log), Persistence Node, License Manager,
#                                    PostgreSQL (CNPG) y OpenLDAP
#   dx-deploy-rwx  ReadWriteMany  -> binarios de DAM (compartidos entre pods de DAM)
#
# Crear o adaptar las StorageClasses es tarea del administrador del clúster. Si las tuyas se llaman
# de otra forma, cambia los nombres en esos dos ficheros.
#
# Longhorn sirve RWX con un "share-manager" NFS: los nodos necesitan el cliente NFS
# (Ubuntu: apt install nfs-common). En OpenShift lo habitual es ODF (ocs-storagecluster-ceph-rbd
# para RWO y ocs-storagecluster-cephfs para RWX) o un aprovisionador NFS.
#
# Aplicar (solo si no existen):   kubectl apply -f common/storageclasses-longhorn.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dx-deploy-rwo
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: disabled
  fsType: ext4
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dx-deploy-rwx
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: disabled
  fsType: ext4
