# REFERENCE · StorageClasses of the reference lab cluster (k3s + Longhorn 1.12).
#
# DX needs two StorageClasses. Their names are set in env.sh (SC_RWO / SC_RWX) and the scripts
# pass them to every chart:
#   dx-deploy-rwo  ReadWriteOnce  -> Web Engine (customization, log), Persistence Node, License Manager,
#                                    PostgreSQL (CNPG), OpenLDAP and OpenSearch
#   dx-deploy-rwx  ReadWriteMany  -> DAM binaries (shared by the DAM pods)
#
# Creating or adapting the StorageClasses is the cluster administrator's job. If yours have other
# names, just set SC_RWO / SC_RWX in env.sh.
#
# Longhorn serves RWX with an NFS "share-manager": nodes need the NFS client
# (Ubuntu: apt install nfs-common). On OpenShift the usual choice is ODF (ocs-storagecluster-ceph-rbd
# for RWO and ocs-storagecluster-cephfs for RWX) or an NFS provisioner.
# No cluster at all? Lab 0 (lab0-poc-wsl) builds a single-node one on WSL2.
#
# Apply (only if they do not exist):   kubectl apply -f common/storageclasses-longhorn.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dx-deploy-rwo
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: disabled
  fsType: ext4
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dx-deploy-rwx
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: disabled
  fsType: ext4
