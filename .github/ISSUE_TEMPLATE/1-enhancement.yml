name: "🚀 Enhancement (spec)"
description: A new capability, option or use case. Written as a short spec, so that it can be built and tested from the issue alone.
title: "[Enhancement] "
projects: ["europesip/4"]
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is the **spec** of the change: what and why, not how. Keep it short and testable.
        The maintainers add the priority (`P1`-`P3`), the area, the **Effort** and the **Release** when it is triaged.
        See [docs/workflow.md](https://github.com/europesip/hcl-dx-compose-labs/blob/main/docs/workflow.md). **Never paste credentials, keys or licence data.**
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph. What should change, and for whom?
    validations: {required: true}
  - type: textarea
    id: current
    attributes:
      label: Current behaviour (checked in the code)
      description: How it works today, with the files involved.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "The expected behaviour, from the user's point of view. Split it in parts if it is big."
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Checkable statements. Prefer \"Given ... when ... then ...\". The change is done when every box is ticked."
      value: |
        - [ ] Given ..., when ..., then ...
        - [ ] The lab runs end to end on the lab cluster, following the guide word for word
    validations: {required: true}
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this change deliberately does not do.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - "Lab 0 and Lab 1 (PoC on WSL, DX base, Script Applications)"
        - "Lab 2 (LDAP and PostgreSQL)"
        - "Lab 3 (IQ, LiteLLM, MCP)"
        - "Lab 4 and Lab 5 (Search, ÓRBITA)"
        - "Common scripts, tools, charts and webinar"
        - "Documentation"
    validations: {required: true}
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: "How it will be proven: The affected labs run end to end on the lab cluster (and on WSL for Lab 0), following the guide as written."
    validations: {required: true}
  - type: checkboxes
    id: impact
    attributes:
      label: Release impact
      options:
        - label: "Guides in English and Spanish"
        - label: "issues.md / issues.es.md (deviations from the HCL documentation)"
        - label: "Versions in env.sh and the charts"
        - label: "The installer engine (europesip/hcl-dx-compose-installer) must follow"
        - label: "Webinar material"
  - type: textarea
    id: references
    attributes:
      label: References
      description: HCL documentation, related issues, discussions.
