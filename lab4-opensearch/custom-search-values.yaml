# ------------------------------------------------------------------------------------------
# Lab 4 · custom-search-values.yaml · chart hcl-dx-search 2.36.0 (CF238) · release dx-search
# Only what changes compared to the default values (charts/values-search-default-2.36.0.yaml).
# The adminDN is not here: 01-certs.sh generates it in admin-dn.rendered.yaml.
# Set from env.sh by 02-search-install.sh: the StorageClass (SC_RWO) and the DX release (DX_RELEASE).
#
# hcl-dx-search is HCL software: it goes in the DX namespace, the SAME namespace as DX. So:
#   - the DX HAProxy routes /dx/api/search and /dx/ui/search to <release>-search-middleware-query
#   - search finds the DX HAProxy by itself for the permission (ACL) queries
#   - both charts share the push-admin credential (DAM pushes its assets to the index)
# ------------------------------------------------------------------------------------------
images:
  repository: "hclcr.io"
  imagePullSecrets:
    - name: regcred
  # names (dx-compose/dx-opensearch, ...) and CF238 tags: the chart ones

volumes:
  openSearchManager:
    data:
      storageClassName: "dx-deploy-rwo"   # the chart default is "manual"
      requests:
        storage: "5Gi"

applications:
  openSearch: true
  searchMiddleware: true
  # Extracts the text of DAM documents (Office, PDF...) to index it (1 CPU / 2 GiB).
  # The chart ships it disabled, but the CF238 Search Middleware looks for it anyway and, without
  # it, logs "Could not connect to file processor" every 3 seconds: we enable it.
  fileProcessor: true

security:
  # searchadmin and pushadmin: empty passwords -> the chart generates them and stores them in secrets.
  # pushadmin must match the DX one: with the dx-deployment / dx-search releases in the same
  # namespace, both charts converge on the same secret by themselves (so they are not created by hand).
  pushAdministration:
    deploymentReleaseName: "dx-deployment"   # = DX_RELEASE

configuration:
  containerTimezone: "Europe/Madrid"
  automatedSetup:
    # DX release in the same namespace: creates the content sources and the crawlers
    dxDeploymentName: "dx-deployment"        # = DX_RELEASE
    # Protocol the crawlers and the permission (ACL) queries use to call the DX HAProxy.
    # The default is "http" (port 80), but the DX HAProxy only listens on 443 with TLS
    # (networking.haproxy.ssl: true, the default): without this, timeout and 0 documents.
    haproxyProtocol: "https"
    digitalAssetManagement:
      enabled: true
    wcm:
      enabled: true          # crawled every 15 minutes (crawlerSchedule)
    jcr:
      enabled: true
    portal:
      enabled: true
    people:
      enabled: false         # People Service is not installed in these labs
