# ------------------------------------------------------------------------------------------
# Lab 4 · DX layer: Search V2 with OpenSearch
# Added by common/dx-helm.sh as soon as the <SEARCH_RELEASE>-search-middleware-query service exists.
# Documentation: DX Compose CF239 > Enabling Search V2.
# ------------------------------------------------------------------------------------------
networking:
  # "query" service of the Search Middleware (<search release>-search-middleware-query), in the
  # same namespace. HAProxy routes /dx/api/search and /dx/ui/search to it.
  # dx-helm.sh sets it from SEARCH_RELEASE.
  searchMiddlewareService: "dx-search-search-middleware-query"

configuration:
  searchMiddleware:
    # Enables Search V2 in DX Compose (the V2 UI is already enabled in the Web Engine)
    enabled: true
    # hcl-dx-search release: the shared push-admin credential is read from it (default value).
    # dx-helm.sh sets it from SEARCH_RELEASE.
    searchReleaseName: "dx-search"
    # DAM sends its assets to the index
    damIndexing: true
