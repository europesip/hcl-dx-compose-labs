# ------------------------------------------------------------------------------------------
# Lab 2 · Enterprise branch · DX layer: Web Engine on Oracle (transfer from Derby)
# Added by common/dx-helm.sh INSTEAD of the PostgreSQL layer when the dx-oracle-ca secret exists
# (TCPS connection). Without TLS it is not needed: the PostgreSQL layer is identical except for
# the truststore.
#
# Oracle IS supported by HCL for the Web Engine in CF238 (19c and 21c, AL32UTF8/AL16UTF16).
# Documentation: DX Compose CF238 > Configuring an external database and database transfer.
# ------------------------------------------------------------------------------------------
configuration:
  webEngine:
    useExternalDatabase: true
    customDbTypePropertiesSecret: custom-credentials-webengine-dbtype-secret
    customDbDomainPropertiesSecret: custom-credentials-webengine-dbdomain-secret
    # false with the PDB just prepared by setup-oracle-dx.sql. true ONLY to redo the transfer
    # over schemas that already have tables (it DELETES them); afterwards, false again.
    dropDatabaseTables: false
    # CA of the TCPS listener in the Web Engine truststore (requires a pod restart)
    customTruststoreSecrets:
      oracle-ca: "dx-oracle-ca"
