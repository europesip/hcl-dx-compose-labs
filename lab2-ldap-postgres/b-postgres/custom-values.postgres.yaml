# ------------------------------------------------------------------------------------------
# Lab 2B · Capa de DX: Web Engine sobre el PostgreSQL de dx-shared (transferencia desde Derby)
# La añade common/dx-helm.sh en cuanto existe el secret custom-credentials-webengine-dbdomain-secret.
#
# Documentación: DX Compose CF238 > Configuring an external database and database transfer.
# ⚠️ PostgreSQL aún no está soportado por HCL para el Web Engine (ver GUIA, apartado 2B).
# ------------------------------------------------------------------------------------------
configuration:
  webEngine:
    # true = en el siguiente arranque el Web Engine transfiere UNA vez los datos de Derby a la BD
    # externa. Lo registra al terminar, así que reinicios y upgrades posteriores no la repiten.
    useExternalDatabase: true
    customDbTypePropertiesSecret: custom-credentials-webengine-dbtype-secret
    customDbDomainPropertiesSecret: custom-credentials-webengine-dbdomain-secret
    # false: la BD de destino está vacía (recién creada por CNPG). Solo se pone a true si hay que
    # rehacer la transferencia sobre una BD con tablas (BORRA su contenido); en ese caso, vuelve a
    # false en cuanto termine (recomendación de HCL).
    dropDatabaseTables: false
