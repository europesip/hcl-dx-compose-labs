# Lab 2B · PostgreSQL 18 for the DX Web Engine, managed by CloudNativePG, in the shared namespace.
# Applied by 03-postgres-cluster.sh (replaces ${SHARED_NS}, ${PG_CLUSTER} and ${SC_RWO}).
#
# ⚠️ Support: in CF238 HCL documents DB2, Oracle and SQL Server for the Web Engine. PostgreSQL is
# being validated by HCL (their tests work with PostgreSQL 18) but it is NOT SUPPORTED TODAY.
# This lab is for learning the transfer process, not for production.
#
# Write service: ${PG_CLUSTER}-rw.${SHARED_NS}.svc.cluster.local:5432
# Status:  kubectl -n ${SHARED_NS} get clusters.postgresql.cnpg.io
#          (on Rancher, "kubectl get cluster" clashes with Cluster API: use the full name)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${PG_CLUSTER}
  namespace: ${SHARED_NS}
spec:
  instances: 1                      # lab; 3 for HA (1 primary + 2 replicas)
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie   # pinned minor version
  primaryUpdateStrategy: unsupervised

  enableSuperuserAccess: true
  superuserSecret:
    name: dx-pg-superuser

  postgresql:
    parameters:
      max_connections: "500"
      # DX uses XA transactions (2PC): PostgreSQL requires max_prepared_transactions > 0
      max_prepared_transactions: "500"
      shared_buffers: "512MB"
      timezone: "Europe/Madrid"

  storage:
    storageClass: ${SC_RWO}
    size: 10Gi

  # Tablespaces used by the DX JCR. CNPG creates them declaratively, each one in its own PVC.
  tablespaces:
    - name: icmlfq32
      owner: { name: dxuser }
      storage: { storageClass: ${SC_RWO}, size: 2Gi }
    - name: icmlnf32
      owner: { name: dxuser }
      storage: { storageClass: ${SC_RWO}, size: 1Gi }
    - name: icmvfq04
      owner: { name: dxuser }
      storage: { storageClass: ${SC_RWO}, size: 1Gi }
    - name: icmsfq04
      owner: { name: dxuser }
      storage: { storageClass: ${SC_RWO}, size: 2Gi }
    - name: icmlsndx
      owner: { name: dxuser }
      storage: { storageClass: ${SC_RWO}, size: 1Gi }

  bootstrap:
    initdb:
      database: dx_core
      owner: dxuser
      secret:
        name: dx-pg-dxuser
      encoding: UTF8
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
      # Schemas, roles, grants, extensions and parameters of dx_core: run ONCE, as postgres,
      # inside dx_core. The SQL is in setup-postgres-dx.sql; 03-postgres-cluster.sh loads it
      # into the dx-pg-setup-sql ConfigMap (see GUIDE, Lab 2B step 3).
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: dx-pg-setup-sql
            key: setup-postgres-dx.sql

  # Login users managed by CNPG (password in a basic-auth secret)
  managed:
    roles:
      # For the Lab 3 appendix (IQ sessions in PostgreSQL). The iqdb database is created there.
      - name: dx_iq_db_user
        ensure: present
        login: true
        passwordSecret:
          name: dx-pg-iquser
