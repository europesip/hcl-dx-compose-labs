# ------------------------------------------------------------------------------------------
# Lab 2A · DX layer: authentication against the OpenLDAP in the shared namespace
# Added by common/dx-helm.sh as soon as the dx-ldap-bind secret exists (03-dx-upgrade.sh).
#
# It uses the NATIVE LDAP configuration of the chart (configuration.webEngine.ldap, type "other"),
# documented in DX Compose CF238 > Configuring LDAP. The chart generates the Open Liberty
# <ldapRegistry> and <federatedRepository>; only special filters or attributes would need a
# configOverrideFiles with your own XML (see enterprise/active-directory).
#
# The basic registry is kept (security.webEngine.basicRegistry.enabled: true, the default): the
# federated repository includes both the basic registry (wpsadmin) and the LDAP, so wpsadmin can
# still log in and so can the LDAP users. If it were disabled, the administrator would have to
# exist in the LDAP and webEngineUser would have to be its full DN.
# ------------------------------------------------------------------------------------------
configuration:
  webEngine:
    ldap:
      type: "other"                 # none | dx (DX OpenLDAP) | other (external LDAP)
      host: "openldap.dx-shared.svc.cluster.local"   # overridden by dx-helm.sh with ${LDAP_HOST}
      port: 389
      sslEnabled: false             # lab; in production 636 + truststore (see GUIDE)
      suffix: "dc=dxdemo,dc=com"    # baseDN for searches
      serverType: "Custom"
      id: "dx_ldap"
      # Bind user (full DN) and password in a secret with keys bindUser/bindPassword
      customLdapSecret: "dx-ldap-bind"
