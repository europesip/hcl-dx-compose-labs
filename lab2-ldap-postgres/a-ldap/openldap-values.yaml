# Lab 2A · OpenLDAP de laboratorio en dx-shared (software de terceros, no de HCL)
# Chart comunitario helm-openldap/openldap-stack-ha 4.3.3 (OpenLDAP 2.6.9, imagen jpgouin/openldap).
# En un cliente real se usaría su directorio corporativo (OpenLDAP, Active Directory, etc.) y este
# paso desaparece: solo cambian host, puerto, sufijo y usuario de bind en custom-values.ldap.yaml.
#
# Resultado:
#   servicio  openldap.dx-shared.svc.cluster.local:389 (ldap) y :636 (ldaps)
#   sufijo    dc=dxdemo,dc=com
#   admin     cn=admin,dc=dxdemo,dc=com  (contraseña en el secret openldap-admin)
#   usuarios  ou=users,dc=dxdemo,dc=com: andres, enrique, jordi, macarena, german

global:
  ldapDomain: "dc=dxdemo,dc=com"
  # Contraseñas en un secret creado por 01-ldap-install.sh (no en este fichero)
  existingSecret: openldap-admin

replicaCount: 1
replication:
  enabled: false             # un solo nodo: sin replicación multi-master

persistence:
  enabled: true
  storageClass: dx-deploy-rwo
  size: 1Gi

# Estructura y usuarios de demo. Se cargan SOLO en el primer arranque (PVC vacío).
customLdifCm: openldap-demo-ldif

ltb-passwd:
  enabled: false
phpldapadmin:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# OpenShift: la SCC restricted-v2 no permite el runAsUser/fsGroup fijos del chart. Descomenta
# para que OpenShift asigne el UID del rango del namespace:
# podSecurityContext:
#   enabled: false
# containerSecurityContext:
#   enabled: false
