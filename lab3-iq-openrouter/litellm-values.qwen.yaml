# Lab 3 · Optional overlay: Qwen instead of Claude (cheaper, for a PoC or a lab; NOT for production)
# Applied ON TOP of litellm-values.yaml when IQ_LLM=qwen in env.sh (02-litellm-install.sh adds
# "-f litellm-values.qwen.yaml"). Helm replaces the whole model_list with this one; the rest of
# litellm-values.yaml (image, secrets, drop_params...) still applies.
#
# Same two logical models, so IQ is not touched:
#   iq-general-purpose -> Qwen 3.7 Plus   (tool use and answers)
#   iq-summary         -> Qwen 3.8 Flash  (conversation summary)
# Claude Sonnet 4.6 is the model HCL validates and the recommended one for production. Qwen
# follows the IQ tools well enough for a PoC, but it knows less about HCL DX: answers to
# "how do I..." questions (no tools, from the model's own knowledge) are weaker.
# Measured on CF239 (IQ 1.0.3, enableDam: true, 60 tools): ~$0.005-0.01 per question, against
# ~$0.03-0.14 with Claude (GUIDE.md, "Cost and choice of model").
#
# "openrouter/" provider (OpenAI format): IQ 1.0.3 publishes valid tool names, so the anthropic/
# workaround of litellm-values.yaml is not needed. cache_control is kept: OpenRouter passes it to
# the providers that support it and ignores it elsewhere.
# Prices and IDs change: check https://openrouter.ai/models before a session.
proxy_config:
  model_list:
    - model_name: iq-general-purpose
      litellm_params:
        model: openrouter/qwen/qwen3.7-plus
        api_key: os.environ/OPENROUTER_API_KEY
        cache_control_injection_points:
          - location: message
            role: system
    - model_name: iq-summary
      litellm_params:
        model: openrouter/qwen/qwen3.8-flash
        api_key: os.environ/OPENROUTER_API_KEY
        cache_control_injection_points:
          - location: message
            role: system
