# Lab 3 · Appendix · Optional IQ layer: cross-session memory (RAG), new in CF239
# IQ keeps chunks of each user's past conversations in PostgreSQL (pgvector) and adds the relevant
# ones to the prompt of new questions. Requires the sessions appendix (PostgreSQL) and the pgvector
# extension (A1-iq-database.sh creates it). The embedding aliases are in litellm-values.yaml. Usage:
#   ./04-iq-install.sh -f custom-iq-values.db-external.yaml -f custom-iq-values.rag.yaml
# HCL: "Configuring cross-session memory" (build_sites/iq/installation/enable-rag).
#
# Helm replaces lists whole: this list repeats the three variables of custom-iq-values.yaml and adds
# the RAG ones. 04-iq-install.sh puts the LiteLLM URL of env.sh in it.
# Cost: retrieved memory goes into the system prompt, so that call cannot read the cached prefix
# (~37,000 tokens are written again, see issues.md, CS1479178).
environment:
  pod:
    integrator:
      - name: "DX_CONTEXT_ROOT"
        value: "/wps"
      - name: "LLM_MAX_TOKENS"
        value: "16384"
      - name: "LITELLM_BASE_URL"
        value: "http://litellm.dx-shared.svc.cluster.local:4000"
      - name: "RAG_ENABLED"
        value: "true"
      # Must match the embedding model (BGE-M3 and Cohere v4: 1024). Locked after the first start:
      # changing it, USE_MULTILINGUAL_EMBEDDINGS or the RAG_CHUNK_* values means recreating the RAG
      # tables (rag_chunks, rag_embedding_metadata), which deletes the memory of every user.
      - name: "EMBEDDING_DIMENSIONS"
        value: "1024"
      # Retrieval, can be changed at any time (helm upgrade). IQ 1.0.3 defaults: 10 chunks (the
      # documentation says 5) and a minimum cosine similarity of 0.35.
      # - name: "RAG_TOP_K"
      #   value: "5"
      # - name: "RAG_MIN_SIMILARITY"
      #   value: "0.5"
