# ------------------------------------------------------------------------------------------
# Lab 3 · DX layer: enables IQ
# Added by common/dx-helm.sh as soon as the <IQ_RELEASE>-integrator service exists (04-iq-install.sh).
#
# With this value, the DX HAProxy routes /dx/api/iq/v1/ and /dx/ui/iq/ to the Integrator and the
# IQ button appears in the DX toolbar. It must be "<IQ release>-integrator" (dx-helm.sh sets it
# from IQ_RELEASE).
# ------------------------------------------------------------------------------------------
networking:
  dxIqService: "dx-iq-integrator"
