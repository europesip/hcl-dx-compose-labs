# Lab 3B · EUROPESIP custom MCP Server, in the shared namespace (not HCL software).
# Applied by 01-mcp-deploy.sh, which replaces ${SHARED_NS}. The code (server.py) goes in the
# europesip-mcp-code ConfigMap. Public python:3.12-slim image; the dependencies are installed at
# start-up (requires access to PyPI). In production you would build your own image with the code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: europesip-mcp
  namespace: ${SHARED_NS}
  labels: { app: europesip-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: europesip-mcp }
  template:
    metadata:
      labels: { app: europesip-mcp }
    spec:
      containers:
        - name: mcp
          image: python:3.12-slim
          command: ["sh", "-c", "pip install --no-cache-dir -q 'mcp==1.30.0' uvicorn && exec python /app/server.py"]
          env:
            - { name: PORT, value: "3000" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /probe/ready, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: europesip-mcp-code }
---
apiVersion: v1
kind: Service
metadata:
  name: europesip-mcp
  namespace: ${SHARED_NS}
spec:
  selector: { app: europesip-mcp }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
