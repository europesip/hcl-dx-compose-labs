# Lab 3B · EUROPESIP custom MCP Server, in the shared namespace (not HCL software).
# Applied by 01-mcp-deploy.sh, which replaces ${SHARED_NS}, ${DX_NS} and ${DX_RELEASE}. Public image
# with server.py and its dependencies, built from https://github.com/europesip/hcl-dx-iq-europesip-mcp
# (server.py, in this folder, is a copy of that repository's code).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: europesip-mcp
  namespace: ${SHARED_NS}
  labels: { app: europesip-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: europesip-mcp }
  template:
    metadata:
      labels: { app: europesip-mcp }
    spec:
      containers:
        - name: mcp
          image: ghcr.io/europesip/hcl-dx-iq-europesip-mcp:1.0.1
          env:
            - { name: PORT, value: "3000" }
            # DX entry point inside the cluster, for europesip_whoami (it calls DX with the user's session)
            - { name: DX_URL, value: "https://${DX_RELEASE}-haproxy.${DX_NS}.svc.cluster.local" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /probe/ready, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: europesip-mcp
  namespace: ${SHARED_NS}
spec:
  selector: { app: europesip-mcp }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
