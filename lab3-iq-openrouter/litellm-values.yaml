# Lab 3 · LiteLLM (chart público de BerriAI litellm-helm 1.106.5) en dx-shared
# LiteLLM NO es software de HCL: el chart hcl-dx-iq solo despliega el Integrator y el MCP Server, y
# HCL trata LiteLLM como requisito previo. Versión, parches y configuración son responsabilidad
# de quien lo instala.
#
# Publica los dos modelos lógicos que pide IQ y los enruta a OpenRouter:
#   iq-general-purpose -> preguntas generales y uso de herramientas (MCP)   -> Claude Sonnet 4.6
#   iq-summary         -> resumen de la conversación para reducir contexto  -> Claude Haiku 4.5
# Son los modelos que valida HCL, con su ID de OpenRouter. Para cambiarlos: cambia el ID
# (https://openrouter.ai/models) y vuelve a ejecutar 02-litellm-install.sh. IQ no se toca.
#
# Proveedor "anthropic/" contra el endpoint Anthropic de OpenRouter (y NO "openrouter/"):
#   el MCP Server de HCL publica herramientas con puntos en el nombre (dam.mime-type.tool...).
#   El proveedor anthropic/ sanea esos nombres al formato que exige Claude y los traduce de vuelta;
#   openrouter/ (formato OpenAI) los envía tal cual y Claude rechaza la petición (HTTP 400).
#   Formato: model "anthropic/<id OpenRouter>", api_base https://openrouter.ai/api
#
# No uses modelos de razonamiento de OpenAI (gpt-5.x): inyectan reasoning_effort y rompen las
# herramientas de IQ. Con modelos que no sean Claude, HCL indica desactivar enableDam en IQ.
replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: "1.106.5"            # fijada (= appVersion del chart); el chart usa pullPolicy Always por defecto
  pullPolicy: IfNotPresent

# Master key y clave de OpenRouter en el secret litellm-env (01-secrets.sh)
masterkeySecretName: litellm-env
masterkeySecretKey: PROXY_MASTER_KEY
environmentSecrets:
  - litellm-env

# Sin base de datos: por defecto el chart despliega su propio PostgreSQL (deployStandalone: true)
db:
  deployStandalone: false
  useExisting: false
migrationJob:
  enabled: false

proxy_config:
  model_list:
    - model_name: iq-general-purpose
      litellm_params:
        model: anthropic/anthropic/claude-sonnet-4.6
        api_base: https://openrouter.ai/api
        api_key: os.environ/OPENROUTER_API_KEY
        # Prompt caching: marca el system prompt como fin de la parte cacheable. Anthropic cachea
        # por prefijo (herramientas -> system -> mensajes): cubre las ~53 herramientas y el prompt,
        # que son la mayor parte de los tokens de cada petición de IQ.
        cache_control_injection_points:
          - location: message
            role: system
    - model_name: iq-summary
      litellm_params:
        model: anthropic/anthropic/claude-haiku-4.5
        api_base: https://openrouter.ai/api
        api_key: os.environ/OPENROUTER_API_KEY
        cache_control_injection_points:
          - location: message
            role: system
  litellm_settings:
    drop_params: true       # HCL: imprescindible; descarta parámetros que el proveedor no admite
    json_logs: true
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

logLevel: INFO

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi
