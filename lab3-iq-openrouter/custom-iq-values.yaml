# ------------------------------------------------------------------------------------------
# Lab 3 · custom-iq-values.yaml · chart hcl-dx-iq 1.0.2 (CF238) · release dx-iq · namespace dx-demo
# Sin secretos. Se usa siempre con helm upgrade -f (nunca --reuse-values).
# configuration.dx.releaseName y externalHost los pasa 04-iq-install.sh desde env.sh.
#
# Desviaciones respecto a la documentación de HCL (necesarias en IQ 1.0.2, ver GUIA, apartado 3):
#   - LITELLM_BASE_URL: variable no documentada pero imprescindible.
#   - LiteLLM detrás de OpenRouter: HCL no valida OpenRouter (sí LiteLLM).
# ------------------------------------------------------------------------------------------
images:
  repository: "hclcr.io"
  imagePullSecrets:
    - name: regcred
  # Sin tags: el chart trae las imágenes compatibles con CF238

configuration:
  dx:
    releaseName: "dx-deployment"   # = DX_RELEASE
    externalHost: ""               # = DX_HOST; el LLM lo usa para construir los enlaces que devuelve
    # Vacío = se entra por HAProxy de DX (https://<releaseName>-haproxy:443)
    internalHost: ""
    port: 443
    ssl: true

  # Sesiones de chat en SQLite en memoria (se pierden al reiniciar el pod). Para guardarlas en el
  # PostgreSQL de dx-shared, ver el apéndice de la GUIA (custom-iq-values.db-external.yaml).
  database:
    enabled: false

  mcpServer:
    standaloneMode: false
    enableWcm: true
    # Funciona con Claude gracias al proveedor anthropic/ de LiteLLM (ver litellm-values.yaml).
    # Con un proveedor que no corrija los nombres de herramienta con puntos -> enableDam: false
    enableDam: true

  # LiteLLM vive en otro namespace: se usa el FQDN del servicio (= LITELLM_URL_INTERNAL)
  litellm:
    liteLlmUrl: "http://litellm.dx-shared.svc.cluster.local:4000"

  licensing:
    deploymentKey: ""        # vacío: clave estática de iq-litellm-api-secret (sin KMS)

environment:
  pod:
    integrator:
      - name: "DX_CONTEXT_ROOT"
        value: "/wps"
      # Tope de tokens de respuesta, por debajo del máximo de los dos modelos (Haiku 4.5: 64k)
      - name: "LLM_MAX_TOKENS"
        value: "16384"
      # No documentada pero imprescindible en el Integrator 1.0.2: es la URL que usa realmente el
      # adaptador LLM. Sin ella llama a una URL interna de HCL. Mismo valor que litellm.liteLlmUrl.
      - name: "LITELLM_BASE_URL"
        value: "http://litellm.dx-shared.svc.cluster.local:4000"
      # LITELLM_URL y LITELLM_API_KEY NO van aquí: el chart las redefine. La clave llega con el
      # secret iq-litellm-api-secret (01-secrets.sh).

scaling:
  replicas:
    integrator: 1            # con SQLite en memoria debe ser 1 (multi-pod requiere PostgreSQL)
    mcpServer: 1

resources:
  integrator:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1024Mi" }
  mcpServer:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

logging:
  integrator:
    level:
      - "api:server-v1:*=info"     # "api:*=debug" solo mientras depuras
  mcpServer:
    level:
      - "api:server-v1:*=info"
