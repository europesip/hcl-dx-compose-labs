# ------------------------------------------------------------------------------------------
# Lab 3 · custom-iq-values.yaml · chart hcl-dx-iq 1.0.2 (CF238) · release dx-iq · DX namespace
# No secrets. Always used with helm upgrade -f (never --reuse-values).
# Set from env.sh by 04-iq-install.sh: configuration.dx.releaseName, externalHost and the
# LiteLLM URL (both occurrences of http://litellm.dx-shared...:4000 below).
#
# Deviations from the HCL documentation (needed in IQ 1.0.2, see GUIDE, section 3):
#   - LITELLM_BASE_URL: undocumented but essential variable.
#   - LiteLLM in front of OpenRouter: HCL does not validate OpenRouter (it does validate LiteLLM).
# ------------------------------------------------------------------------------------------
images:
  repository: "hclcr.io"
  imagePullSecrets:
    - name: regcred
  # No tags: the chart ships the images compatible with CF238

configuration:
  dx:
    releaseName: "dx-deployment"   # = DX_RELEASE
    externalHost: ""               # = DX_HOST; the LLM uses it to build the links it returns
    # Empty = enter through the DX HAProxy (https://<releaseName>-haproxy:443)
    internalHost: ""
    port: 443
    ssl: true

  # Chat sessions in in-memory SQLite (lost when the pod restarts). To store them in the
  # PostgreSQL of the shared namespace, see the GUIDE appendix (custom-iq-values.db-external.yaml).
  database:
    enabled: false

  mcpServer:
    standaloneMode: false
    enableWcm: true
    # Works with Claude thanks to the LiteLLM anthropic/ provider (see litellm-values.yaml).
    # With a provider that does not fix tool names containing dots -> enableDam: false
    enableDam: true

  # LiteLLM lives in another namespace: the service FQDN is used (= LITELLM_URL_INTERNAL)
  litellm:
    liteLlmUrl: "http://litellm.dx-shared.svc.cluster.local:4000"

  licensing:
    deploymentKey: ""        # empty: static key from iq-litellm-api-secret (no KMS)

environment:
  pod:
    integrator:
      - name: "DX_CONTEXT_ROOT"
        value: "/wps"
      # Response token cap, below the maximum of both models (Haiku 4.5: 64k)
      - name: "LLM_MAX_TOKENS"
        value: "16384"
      # Undocumented but essential in Integrator 1.0.2: it is the URL the LLM adapter really
      # uses. Without it, it calls an internal HCL URL. Same value as litellm.liteLlmUrl.
      - name: "LITELLM_BASE_URL"
        value: "http://litellm.dx-shared.svc.cluster.local:4000"
      # LITELLM_URL and LITELLM_API_KEY do NOT go here: the chart redefines them. The key comes
      # from the iq-litellm-api-secret secret (01-secrets.sh).

scaling:
  replicas:
    integrator: 1            # with in-memory SQLite it must be 1 (multi-pod requires PostgreSQL)
    mcpServer: 1

resources:
  integrator:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1024Mi" }
  mcpServer:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

logging:
  integrator:
    level:
      - "api:server-v1:*=info"     # "api:*=debug" only while debugging
  mcpServer:
    level:
      - "api:server-v1:*=info"
