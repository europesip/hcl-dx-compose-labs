# Lab 3 · Appendix · Optional IQ layer: chat sessions in the PostgreSQL of the shared namespace
# Requires Lab 2B (PostgreSQL cluster) and ./A1-iq-database.sh. Usage:
#   ./04-iq-install.sh -f custom-iq-values.db-external.yaml
configuration:
  database:
    enabled: true
    dbHost: "dx-pg-rw.dx-shared.svc.cluster.local"   # overridden by 04-iq-install.sh with ${PG_HOST}
    dbPort: 5432
    dbName: "iqdb"
    dbCustomSecret: "custom-external-db-credentials" # secret in the DX namespace (username/password)
    dbTlsEnabled: false                              # CNPG serves TLS: it can be set to true

scaling:
  replicas:
    integrator: 1            # with PostgreSQL it could already scale to more than 1
